steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/udaipur-hostel-dashboard:$COMMIT_SHA', '.']

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/udaipur-hostel-dashboard:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'udaipur-hostel-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/udaipur-hostel-dashboard:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--set-env-vars'
      - 'SPREADSHEET_ID=1PiDruAwIELMPwgiVJ6TxTIqKqJeaw_LmTAyCNyEvLNM,DASHBOARD_ACCESS_TOKEN=udaipur-hostel-key-2026'

images:
  - 'gcr.io/$PROJECT_ID/udaipur-hostel-dashboard:$COMMIT_SHA'
